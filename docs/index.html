<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Overlay — карточка трека для Android-магнитол</title>
<meta name="description" content="Компактная карточка с текущим треком поверх любого приложения для Android-магнитол и автомобильных Android-устройств.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #080c17;
    --text: #f4f7ff;
    --muted: #94a0bb;
    --line: rgba(255, 255, 255, 0.10);
    --accent: #a99bff;
    --accent-2: #5ee7d2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(900px 520px at 84% -10%, rgba(139, 124, 246, 0.20), transparent 62%),
      radial-gradient(700px 460px at 2% 6%, rgba(45, 212, 191, 0.09), transparent 58%),
      var(--bg);
    color: var(--text);
    font: 16px/1.68 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 30px 24px 80px; }

  header { display: flex; align-items: center; gap: 14px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .logo { width: 44px; height: 44px; border-radius: 11px; }
  .brand { flex: 1 1 auto; font-weight: 650; font-size: 16px; letter-spacing: -0.01em; }
  .brand span { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .lang { display: inline-flex; gap: 14px; }
  .lang button {
    appearance: none; border: 0; background: none; color: var(--muted); padding: 2px 0;
    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .06em; cursor: pointer;
    border-bottom: 1px solid transparent; transition: color .15s ease, border-color .15s ease;
  }
  .lang button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }

  .hero { display: grid; grid-template-columns: 1.08fr 0.92fr; gap: 56px; align-items: center; padding: 58px 0 8px; }
  h1 {
    margin: 0; font-size: clamp(32px, 4.6vw, 50px); line-height: 1.07; letter-spacing: -0.035em;
    background: linear-gradient(115deg, #ffffff 22%, #cfc8ff 58%, #8fe9dd 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { margin: 20px 0 0; font-size: 17px; color: #cbd3e6; max-width: 48ch; }
  .lead strong { color: #fff; font-weight: 600; }

  .release { display: inline-flex; align-items: center; gap: 9px; margin-top: 26px; font-size: 14px; color: #d8dfef; text-decoration: none; }
  .release b { font-weight: 600; color: #fff; }
  .release .date { color: var(--muted); }
  .release:hover b { color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); }

  .actions { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; margin-top: 24px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
    font-weight: 600; font-size: 15px; color: var(--text); padding: 0; background: none; border: 0;
    border-bottom: 1px solid rgba(255,255,255,.22); padding-bottom: 3px;
    transition: color .15s ease, border-color .15s ease;
  }
  .btn:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .btn.primary { color: #0c1020; background: linear-gradient(115deg, #c3b7ff, #a99bff 45%, #6fe6d4); padding: 12px 20px; border: 0; border-radius: 8px; }
  .btn.primary:hover { color: #0c1020; filter: brightness(1.06); }
  .btn svg { width: 16px; height: 16px; }

  /* phone mock: only the top part of the device, cut off at the bottom */
  .stage { position: relative; display: flex; justify-content: center; }
  .stage::before {
    content: ""; position: absolute; inset: 0 0 12% 0; border-radius: 60px;
    background: radial-gradient(circle at 55% 26%, rgba(139,124,246,.34), transparent 62%);
    filter: blur(56px); opacity: .8;
  }
  .stage > div { width: 100%; max-width: 392px; }
  .phone {
    position: relative; width: 100%; height: 452px; padding: 7px 7px 0;
    border-radius: 42px 42px 0 0; background: #0c111c;
    border: 1px solid rgba(255,255,255,.14); border-bottom: 0;
    box-shadow: 0 40px 80px -40px rgba(0,0,0,.95);
  }
  .screen { position: relative; height: 100%; border-radius: 36px 36px 0 0; overflow: hidden; background: #f1efe9; }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 30px; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; font-size: 11.5px; font-weight: 600; color: #2f333a;
  }
  .statusbar .sig { display: flex; align-items: center; gap: 5px; }
  .statusbar .sig i { display: block; width: 3px; border-radius: 1px; background: #2f333a; }
  .statusbar .sig i:nth-child(1) { height: 5px; }
  .statusbar .sig i:nth-child(2) { height: 8px; }
  .statusbar .sig i:nth-child(3) { height: 11px; }
  .statusbar .sig i:nth-child(4) { height: 14px; }
  .map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card {
    position: absolute; left: 4.5%; right: 4.5%; top: 42px; z-index: 2;
    border-radius: 16px; padding: 9px;
    background: linear-gradient(160deg, rgba(71,53,86,.95), rgba(16,19,32,.96));
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 18px 38px -16px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.16);
    backdrop-filter: blur(9px);
  }
  .card-top { display: flex; gap: 9px; align-items: center; }
  .art {
    width: 46px; height: 46px; border-radius: 11px; flex: 0 0 auto;
    background: linear-gradient(140deg, #8b7cf6, #5b4bd6 55%, #2dd4bf);
    border: 1px solid rgba(255,255,255,.26); display: grid; place-items: center;
    color: #fff; font-size: 18px;
  }
  .meta { min-width: 0; flex: 1 1 auto; }
  .meta .t { font-size: 12px; font-weight: 650; letter-spacing: -0.01em; }
  .meta .a { font-size: 10px; color: rgba(248,250,252,.86); }
  .meta .b { font-size: 9px; color: rgba(248,250,252,.6); }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding: 0 1px; color: rgba(248,250,252,.8); }
  .transport { display: flex; align-items: center; gap: 8px; }
  .reactions { display: flex; align-items: center; gap: 7px; color: rgba(248,250,252,.5); }
  .reactions svg { width: 11px; height: 11px; }
  .reactions .flip { transform: scaleY(-1); }
  .controls .play {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(139,124,246,.24); border: 1px solid rgba(139,124,246,.5); color: #fff;
  }
  .controls svg { width: 10px; height: 10px; }
  .hint { margin-top: 14px; text-align: center; font-size: 12px; color: var(--muted); }

  section { padding-top: 54px; }
  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 22px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 15px; margin: -12px 0 22px; }

  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 46px; }
  .feature { padding: 18px 0 20px; border-top: 1px solid var(--line); }
  .feature h3 { margin: 0 0 5px; font-size: 16px; letter-spacing: -0.01em; }
  .feature p { margin: 0; color: var(--muted); font-size: 14.5px; }

  ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  ol.steps li { position: relative; padding: 16px 0 16px 44px; border-top: 1px solid var(--line); color: #d7ddef; font-size: 15px; }
  ol.steps li::before {
    counter-increment: step; content: counter(step) ".";
    position: absolute; left: 0; top: 16px; color: var(--accent); font-weight: 650;
  }

  .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 46px; }
  .link-row {
    display: flex; align-items: baseline; gap: 12px; text-decoration: none;
    padding: 16px 0; border-top: 1px solid var(--line); transition: color .15s ease;
  }
  .link-row:hover { color: var(--accent); }
  .link-row b { font-size: 15px; font-weight: 600; }
  .link-row span { font-size: 13.5px; color: var(--muted); }
  .link-row:hover span { color: var(--muted); }

  footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  footer .logo { width: 22px; height: 22px; border-radius: 6px; }
  footer .copy { margin-left: auto; }
  footer .copy a { color: #c9c3ff; text-decoration: none; border-bottom: 1px solid rgba(201,195,255,.35); }
  footer .copy a:hover { color: #fff; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; gap: 38px; padding-top: 40px; }
    .stage { order: -1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
const I18N = {
  ru: {
    brandSub: "карточка трека для магнитолы",
    h1: "Трек поверх навигатора",
    lead: "Музыка меняется — поверх текущего приложения на несколько секунд выезжает компактная карточка: обложка, название, исполнитель, альбом и кнопки. Она не забирает фокус и не мешает нажимать на то, что под ней.",
    download: "Скачать APK",
    telegramGroup: "Telegram-группа",
    telegramChannel: "Telegram-канал",
    releaseFallback: "Последний релиз на GitHub",
    cardHint: "так выглядит карточка в машине",
    featuresTitle: "Что умеет",
    f1t: "Шесть тем",
    f1d: "Linen, Porcelain, Obsidian, Night Drive, Aurora, Blueprint — от тёплой бумаги до неона.",
    f2t: "Смена темы тапом",
    f2d: "Тап по карточке вне кнопок переключает оформление и показывает тот же трек в новом виде.",

    f5t: "Обновляется само",
    f5d: "Раз в сутки и по кнопке проверяет новую версию и ставит её после подтверждения.",
    installTitle: "Установка",
    installSub: "Один раз устанавливаем самостоятельно, затем прилетают автоапдейты через OTA.",
    s1: "Скачайте APK из последнего релиза.",
    s2: "Разрешите установку из этого источника и откройте файл.",
    s3: "Выдайте все разрешения, которые просит приложение: оверлей, уведомления, доступ к медиа-сессиям, работа в фоне.",
    s4: "Включите сервис и запустите музыку — карточка появится при смене трека.",
    communityTitle: "Где следить",
    telegramGroupSub: "Вопросы, баги, тема «Релизы»",
    telegramChannelSub: "Только новые версии",
    githubReleases: "GitHub Releases",
    githubReleasesSub: "Все версии и файлы"
  },
  en: {
    brandSub: "now-playing card for head units",
    h1: "Your track, over the navigator",
    lead: "The song changes — and a compact card slides in over the current app for a few seconds: artwork, title, artist, album and controls. It never takes focus and never blocks taps on what is underneath.",
    download: "Download APK",
    telegramGroup: "Telegram group",
    telegramChannel: "Telegram channel",
    releaseFallback: "Latest release on GitHub",
    cardHint: "this is how the card looks in the car",
    featuresTitle: "What it does",
    f1t: "Six themes",
    f1d: "Linen, Porcelain, Obsidian, Night Drive, Aurora, Blueprint — from warm paper to neon.",
    f2t: "Tap to switch theme",
    f2d: "A tap on the card, outside the buttons, moves to the next skin and replays the same track.",
    f3t: "Settings",
    f3d: "Position, card width, timings and animation — with − and + buttons, not finger-dragging.",
    f5t: "Updates itself",
    f5d: "Once a day and on demand it checks for a new build and installs it after you confirm.",
    installTitle: "Install",
    installSub: "Install once by hand — after that updates arrive over the air (OTA).",
    s1: "Download the APK from the latest release.",
    s2: "Allow installs from this source and open the file.",
    s3: "Grant every permission the app asks for: overlay, notifications, media sessions, background work.",
    s4: "Turn the service on and start playing — the card appears on every track change.",
    communityTitle: "Where to follow",
    telegramGroupSub: "Questions, bugs, the “Releases” topic",
    telegramChannelSub: "New versions only",
    githubReleases: "GitHub Releases",
    githubReleasesSub: "Every version and file"
  }
};

const REPO = 'dosoft/mediaoverlay';
const RELEASE_API = 'https://api.github.com/repos/' + REPO + '/releases/latest';
let currentLang = 'ru';
let latestRelease = null;

function formatDate(iso) {
  if (!iso) return '';
  try {
    return new Intl.DateTimeFormat(currentLang === 'ru' ? 'ru-RU' : 'en-GB',
      { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(iso));
  } catch (e) { return String(iso).slice(0, 10); }
}

function renderRelease() {
  const text = document.getElementById('releaseText');
  const link = document.getElementById('release');
  const download = document.getElementById('download');
  if (!latestRelease) { text.textContent = I18N[currentLang].releaseFallback; return; }
  const date = formatDate(latestRelease.date);
  text.innerHTML = '<b>' + latestRelease.version + '</b>' + (date ? ' \u00b7 <span class="date">' + date + '</span>' : '');
  link.href = latestRelease.pageUrl;
  download.href = latestRelease.apkUrl;
}

function fromFeed(d) {
  if (!d || !d.versionName) return null;
  const v = d.versionName;
  return {
    version: v,
    date: d.publishedAt || null,
    pageUrl: 'https://github.com/' + REPO + '/releases/tag/v' + v,
    apkUrl: d.apkUrl || ('https://github.com/' + REPO + '/releases/download/v' + v + '/MediaOverlay-' + v + '.apk')
  };
}

function fromApi(rel) {
  const apk = (rel.assets || []).find(function (a) { return /\.apk$/i.test(a.name); });
  return {
    version: (rel.tag_name || '').replace(/^v/, '') || rel.name || '',
    date: rel.published_at || null,
    pageUrl: rel.html_url,
    apkUrl: apk ? apk.browser_download_url : rel.html_url
  };
}

async function loadRelease() {
  try {
    const r = await fetch('latest.json', { cache: 'no-store' });
    if (r.ok) {
      const rel = fromFeed(await r.json());
      if (rel) { latestRelease = rel; renderRelease(); return; }
    }
  } catch (e) { /* fall through */ }
  try {
    const r = await fetch(RELEASE_API, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (r.ok) {
      const rel = fromApi(await r.json());
      if (rel && rel.version) { latestRelease = rel; renderRelease(); }
    }
  } catch (e) { /* keep the fallback link */ }
}

function applyLang(lang) {
  currentLang = lang === 'en' ? 'en' : 'ru';
  const dict = I18N[currentLang];
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    const value = dict[el.dataset.i18n];
    if (value !== undefined) el.textContent = value;
  });
  document.querySelectorAll('[data-lang]').forEach(function (btn) {
    btn.setAttribute('aria-pressed', String(btn.dataset.lang === currentLang));
  });
  try { localStorage.setItem('mo-lang', currentLang); } catch (e) {}
  renderRelease();
}

const params = new URLSearchParams(location.search);
const saved = (function () { try { return localStorage.getItem('mo-lang'); } catch (e) { return null; } })();
applyLang(params.get('lang') === 'en' || (saved === 'en' && params.get('lang') !== 'ru') ? 'en' : 'ru');

document.querySelectorAll('[data-lang]').forEach(function (btn) {
  btn.addEventListener('click', function () { applyLang(btn.dataset.lang); });
});

loadRelease();
</script>
</body>
</html>

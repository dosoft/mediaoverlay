<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Overlay — карточка трека для Android-магнитол</title>
<meta name="description" content="Компактная карточка с текущим треком поверх любого приложения для Android-магнитол и автомобильных Android-устройств.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #070b16;
    --surface: rgba(255, 255, 255, 0.045);
    --surface-strong: rgba(255, 255, 255, 0.075);
    --line: rgba(255, 255, 255, 0.09);
    --text: #f6f8ff;
    --muted: #98a2bd;
    --accent: #8b7cf6;
    --accent-2: #2dd4bf;
    --accent-deep: #6750a4;
    --radius: 24px;
    --shadow: 0 30px 70px -30px rgba(103, 80, 164, 0.75);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(900px 520px at 82% -8%, rgba(139, 124, 246, 0.28), transparent 62%),
      radial-gradient(720px 460px at 4% 8%, rgba(45, 212, 191, 0.13), transparent 58%),
      radial-gradient(600px 500px at 50% 108%, rgba(103, 80, 164, 0.22), transparent 65%),
      var(--bg);
    color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 22px 72px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 16px; }
  .logo { width: 56px; height: 56px; border-radius: 16px; box-shadow: 0 16px 36px -12px rgba(103, 80, 164, 0.9); }
  .brand { flex: 1 1 auto; font-weight: 700; letter-spacing: -0.01em; font-size: 17px; }
  .brand span { display: block; font-weight: 400; font-size: 13px; color: var(--muted); letter-spacing: 0; }
  .lang { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.03); }
  .lang button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .04em;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: color .15s ease, background .15s ease;
  }
  .lang button[aria-pressed="true"] { background: var(--surface-strong); color: var(--text); }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 48px; align-items: center; margin-top: 64px; }
  h1 {
    margin: 0; font-size: clamp(34px, 5vw, 54px); line-height: 1.06; letter-spacing: -0.035em;
    background: linear-gradient(120deg, #ffffff 20%, #c9c2ff 55%, #8fe9dd 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { margin: 20px 0 0; font-size: 17px; color: #cfd6ea; max-width: 46ch; }
  .lead strong { color: #fff; font-weight: 600; }

  .release {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 26px;
    padding: 9px 14px 9px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); text-decoration: none; font-size: 14px; color: #dbe1f3;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .release:hover { border-color: rgba(139,124,246,.6); background: var(--surface-strong); transform: translateY(-1px); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 4px rgba(45,212,191,.16); }
  .release b { font-weight: 600; color: #fff; }
  .release .date { color: var(--muted); }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px; text-decoration: none; cursor: pointer;
    padding: 14px 22px; border-radius: 14px; font-weight: 600; font-size: 15px;
    border: 1px solid var(--line); color: var(--text); background: var(--surface);
    transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px); border-color: rgba(139,124,246,.55); }
  .btn.primary {
    border-color: transparent; color: #14102a;
    background: linear-gradient(120deg, #b7a9ff, #8b7cf6 45%, #63e3d1);
    box-shadow: 0 18px 40px -18px rgba(139, 124, 246, 0.95);
  }
  .btn.primary:hover { box-shadow: 0 22px 46px -16px rgba(139, 124, 246, 1); }
  .btn svg { width: 17px; height: 17px; }

  /* ---------- overlay card mock ---------- */
  .stage { position: relative; display: flex; justify-content: center; }
  .stage::before {
    content: ""; position: absolute; inset: 6% 8% 12% 8%; border-radius: 40px;
    background: radial-gradient(circle at 60% 30%, rgba(139,124,246,.55), transparent 62%);
    filter: blur(46px); opacity: .75;
  }
  .card {
    position: relative; width: min(100%, 430px); border-radius: 26px; padding: 16px;
    background: linear-gradient(160deg, rgba(71,53,86,.92), rgba(16,19,32,.94));
    border: 1px solid rgba(255,255,255,.13);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.14);
    backdrop-filter: blur(14px);
  }
  .card-top { display: flex; gap: 14px; align-items: center; }
  .art {
    width: 78px; height: 78px; border-radius: 18px; flex: 0 0 auto;
    background: linear-gradient(140deg, #8b7cf6, #5b4bd6 55%, #2dd4bf);
    border: 1px solid rgba(255,255,255,.28);
    display: grid; place-items: center; color: #fff; font-size: 30px;
    box-shadow: 0 10px 24px -12px rgba(0,0,0,.9);
  }
  .meta { min-width: 0; flex: 1 1 auto; }
  .meta .t { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .meta .a { font-size: 13px; color: rgba(248,250,252,.86); }
  .meta .b { font-size: 12px; color: rgba(248,250,252,.6); }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 14px; padding: 0 2px; color: rgba(248,250,252,.8); }
  .transport { display: flex; align-items: center; gap: 14px; }
  .reactions { display: flex; align-items: center; gap: 12px; color: rgba(248,250,252,.5); }
  .reactions svg { width: 17px; height: 17px; }
  .reactions .flip { transform: scaleY(-1); }
  .controls .play {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(139,124,246,.22); border: 1px solid rgba(139,124,246,.5); color: #fff;
  }
  .controls svg { width: 17px; height: 17px; }
  .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: -34px; font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ---------- sections ---------- */
  h2 { font-size: clamp(22px, 3vw, 28px); letter-spacing: -0.025em; margin: 92px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .feature {
    padding: 22px; border-radius: var(--radius); background: var(--surface);
    border: 1px solid var(--line); transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .feature:hover { transform: translateY(-3px); border-color: rgba(139,124,246,.45); background: var(--surface-strong); }
  .icon {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px;
    background: linear-gradient(140deg, rgba(139,124,246,.28), rgba(45,212,191,.18));
    border: 1px solid rgba(139,124,246,.32); color: #dcd6ff;
  }
  .icon svg { width: 19px; height: 19px; }
  .feature h3 { margin: 0 0 6px; font-size: 16px; letter-spacing: -0.01em; }
  .feature p { margin: 0; color: var(--muted); font-size: 14.5px; }

  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; counter-reset: step; }
  .step {
    position: relative; padding: 22px 22px 22px 58px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line);
  }
  .step::before {
    counter-increment: step; content: counter(step);
    position: absolute; left: 18px; top: 20px; width: 26px; height: 26px; border-radius: 9px;
    display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #cfc8ff;
    background: rgba(139,124,246,.2); border: 1px solid rgba(139,124,246,.38);
  }
  .step p { margin: 0; color: #d7ddef; font-size: 14.5px; }
  code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 6px; font-size: .92em; }

  /* ---------- community ---------- */
  .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .link-card {
    display: flex; align-items: center; gap: 16px; text-decoration: none;
    padding: 20px 22px; border-radius: var(--radius); background: var(--surface);
    border: 1px solid var(--line); transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .link-card:hover { transform: translateY(-3px); border-color: rgba(45,212,191,.45); background: var(--surface-strong); }
  .link-card .icon { margin: 0; }
  .link-card b { display: block; font-size: 15px; }
  .link-card span { font-size: 13px; color: var(--muted); }

  footer { margin-top: 76px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 13px; }
  footer .logo { width: 26px; height: 26px; border-radius: 8px; box-shadow: none; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; gap: 40px; margin-top: 44px; }
    .stage { order: -1; }
    .hint { position: static; transform: none; display: block; text-align: center; margin-top: 14px; }
    h2 { margin-top: 64px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

    communitySub: "Releases and discussion on Telegram, builds on GitHub.",
    telegramGroupSub: "Questions, bugs, the “Releases” topic",
    telegramChannelSub: "New versions only",
    githubReleases: "GitHub Releases",
    githubReleasesSub: "Every version and file"
  }
};

const REPO = 'dosoft/mediaoverlay';
const RELEASE_API = 'https://api.github.com/repos/' + REPO + '/releases/latest';
let currentLang = 'ru';
let latestRelease = null;

function formatDate(iso) {
  if (!iso) return '';
  try {
    return new Intl.DateTimeFormat(currentLang === 'ru' ? 'ru-RU' : 'en-GB',
      { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(iso));
  } catch (e) {
    return String(iso).slice(0, 10);
  }
}

function renderRelease() {
  const text = document.getElementById('releaseText');
  const link = document.getElementById('release');
  const download = document.getElementById('download');
  if (!latestRelease) {
    text.textContent = I18N[currentLang].releaseFallback;
    return;
  }
  const date = formatDate(latestRelease.date);
  text.innerHTML = '<b>' + latestRelease.version + '</b>' + (date ? ' · <span class="date">' + date + '</span>' : '');
  link.href = latestRelease.pageUrl;
  download.href = latestRelease.apkUrl;
}

function fromFeed(d) {
  if (!d || !d.versionName) return null;
  const v = d.versionName;
  return {
    version: v,
    date: d.publishedAt || null,
    pageUrl: 'https://github.com/' + REPO + '/releases/tag/v' + v,
    apkUrl: d.apkUrl || ('https://github.com/' + REPO + '/releases/download/v' + v + '/MediaOverlay-' + v + '.apk')
  };
}

function fromApi(rel) {
  const apk = (rel.assets || []).find(function (a) { return /\.apk$/i.test(a.name); });
  return {
    version: (rel.tag_name || '').replace(/^v/, '') || rel.name || '',
    date: rel.published_at || null,
    pageUrl: rel.html_url,
    apkUrl: apk ? apk.browser_download_url : rel.html_url
  };
}

async function loadRelease() {
  // Same-origin feed first: no API rate limits and no dependency on api.github.com.
  try {
    const r = await fetch('latest.json', { cache: 'no-store' });
    if (r.ok) {
      const rel = fromFeed(await r.json());
      if (rel) { latestRelease = rel; renderRelease(); return; }
    }
  } catch (e) { /* fall through to the API */ }
  try {
    const r = await fetch(RELEASE_API, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (r.ok) {
      const rel = fromApi(await r.json());
      if (rel && rel.version) { latestRelease = rel; renderRelease(); }
    }
  } catch (e) { /* keep the fallback link */ }
}

function applyLang(lang) {
  currentLang = lang === 'en' ? 'en' : 'ru';
  const dict = I18N[currentLang];
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    const value = dict[el.dataset.i18n];
    if (value !== undefined) el.textContent = value;
  });
  document.querySelectorAll('[data-lang]').forEach(function (btn) {
    btn.setAttribute('aria-pressed', String(btn.dataset.lang === currentLang));
  });
  try { localStorage.setItem('mo-lang', currentLang); } catch (e) {}
  renderRelease();
}

const params = new URLSearchParams(location.search);
const saved = (function () { try { return localStorage.getItem('mo-lang'); } catch (e) { return null; } })();
applyLang(params.get('lang') === 'en' || (saved === 'en' && params.get('lang') !== 'ru') ? 'en' : 'ru');

document.querySelectorAll('[data-lang]').forEach(function (btn) {
  btn.addEventListener('click', function () { applyLang(btn.dataset.lang); });
});

loadRelease();
</script>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Overlay — всплывающая панель управления музыкой</title>
<meta name="description" content="Всплывающая панель управления музыкой с обложкой и сведениями о треке поверх любого приложения для Android-магнитол и автомобильных Android-устройств.">
<meta name="color-scheme" content="light">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root {
    --paper: #f4f1e9;
    --ink: #1e2425;
    --muted: #565e5c;
    --line: #c8c8bc;
    --accent: #9a4a27;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    background: linear-gradient(145deg, #faf8f1 0%, var(--paper) 45%, #e8e9df 100%);
    font: 16px/1.6 "Trebuchet MS", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: #ebc8a9; color: var(--ink); }
  :focus-visible { outline: 3px solid #a4512a; outline-offset: 4px; }
  a { color: inherit; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px clamp(22px, 5vw, 72px) 46px; }
  header { display: flex; align-items: center; gap: 13px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .logo { width: 43px; height: 43px; border-radius: 10px; }
  .brand { flex: 1; font-size: 16px; font-weight: 700; line-height: 1.25; }
  .brand span { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .lang { display: flex; gap: 6px; }
  .lang button {
    appearance: none; min-width: 40px; min-height: 40px; border: 0; background: transparent;
    color: var(--muted); font: 700 12px "Trebuchet MS", sans-serif; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 7px; text-decoration-thickness: 2px; }
  .hero { position: relative; isolation: isolate; padding-top: clamp(42px, 7vw, 88px); }
  .hero::before {
    content: ""; position: absolute; z-index: -2; inset: 0 -18px -65px; pointer-events: none;
    background:
      radial-gradient(ellipse at 13% 26%, rgba(235, 191, 148, .48), transparent 49%),
      radial-gradient(ellipse at 88% 39%, rgba(160, 195, 192, .42), transparent 47%),
      radial-gradient(ellipse at 48% 77%, rgba(231, 206, 167, .36), transparent 52%);
    mask-image: radial-gradient(ellipse 50% 55% at 50% 45%, #000 30%, transparent 100%);
  }
  .hero-geometry {
    position: absolute; z-index: -1; inset: 0; width: 100%; height: 100%;
    overflow: visible; pointer-events: none;
  }
  .hero-intro { display: grid; grid-template-columns: 1.05fr .8fr; gap: 7%; align-items: end; }
  h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: -.035em; }
  h1 { max-width: 10ch; margin: 0; font-size: clamp(48px, 6.6vw, 88px); line-height: .98; text-wrap: balance; }
  .lead { max-width: 55ch; margin: 0; font-size: clamp(15px, 1.3vw, 17px); color: var(--muted); }
  .release { display: inline-flex; align-items: center; gap: 9px; margin-top: 20px; font-size: 13px; text-decoration: none; }
  .release .date { color: var(--muted); }
  .release:hover, .btn:not(.primary):hover, .link-row:hover { color: var(--accent); }
  .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: #65865c; }
  .actions { display: flex; align-items: center; gap: 12px 22px; flex-wrap: wrap; margin-top: 23px; }
  .btn { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; font-size: 13px; font-weight: 700; text-decoration: none; }
  .btn:not(.primary) { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 5px; }
  .btn.primary { padding: 13px 19px; background: var(--ink); color: #fff; }
  .btn.primary:hover { background: var(--accent); }
  .btn svg { width: 16px; height: 16px; }

  /* The landscape screen is the product demonstration, not a phone frame. */
  .stage { margin: clamp(44px, 6vw, 76px) auto 0; max-width: 1030px; }
  .headunit {
    padding: clamp(7px, 1.2vw, 14px); background: #25292a;
    border-radius: 17px; box-shadow: 0 28px 50px -30px rgba(29, 35, 34, .55);
  }
  .screen { position: relative; aspect-ratio: 900 / 460; overflow: hidden; background: #eeeae0; border-radius: 6px; }
  .map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card {
    position: absolute; left: 27%; top: 7%; width: 46%; z-index: 2;
    border-radius: 12px; padding: clamp(7px, 1.1vw, 13px); color: #fff;
    background: linear-gradient(160deg, #493b56, #171b27);
    box-shadow: 0 14px 28px -9px rgba(29, 29, 35, .55);
  }
  .card-top { display: flex; gap: clamp(7px, 1vw, 12px); align-items: center; }
  .art {
    width: clamp(32px, 5vw, 58px); aspect-ratio: 1; border-radius: 9px; flex: none;
    background: linear-gradient(140deg, #8b7cf6, #5b4bd6 55%, #2dd4bf);
    display: grid; place-items: center; color: #fff; font-size: clamp(15px, 2vw, 23px);
  }
  .meta { min-width: 0; flex: 1; line-height: 1.35; }
  .meta .t { font-size: clamp(10px, 1.25vw, 14px); font-weight: 700; }
  .meta .a { font-size: clamp(9px, 1vw, 12px); color: #ece8f0; }
  .meta .b { font-size: clamp(8px, .85vw, 10px); color: #cbc5d0; }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; color: #ded9e4; }
  .transport, .reactions { display: flex; align-items: center; gap: 9px; }
  .reactions { color: #c9c1cf; }
  .reactions .flip { transform: scaleY(-1); }
  .controls .play { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #635481; color: #fff; }
  .controls svg { width: 12px; height: 12px; }
  .countdown {
    position: absolute; right: 3%; bottom: 6%; z-index: 2; width: clamp(30px, 4vw, 46px);
    aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%;
    color: #fff; background: rgba(30, 36, 37, .84); opacity: 0;
  }
  .countdown svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .countdown-progress { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 107; }
  .countdown-number { font-size: clamp(12px, 1.5vw, 16px); font-weight: 700; line-height: 1; }
  .countdown-number::before { content: ""; }
  .stage-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 7px; }
  .hint { color: var(--muted); font-size: 12px; }

  .content-section { padding-top: clamp(70px, 9vw, 120px); }
  h2 { margin: 0; font-size: clamp(38px, 4vw, 54px); line-height: 1.05; }
  .features { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8%; margin-top: 35px; }
  .feature { display: grid; grid-template-columns: .8fr 1fr; gap: 20px; padding: 24px 0 30px; border-top: 1px solid var(--line); }
  .feature h3 { margin: 0; font-size: 17px; line-height: 1.3; }
  .feature p { margin: 0; color: var(--muted); font-size: 14px; }
  .install { display: grid; grid-template-columns: .8fr 1fr; column-gap: 10%; }
  .sub { max-width: 30ch; margin: 20px 0 0; color: var(--muted); }
  .install-notice {
    display: grid; grid-template-columns: 24px 1fr; gap: 14px; max-width: 48ch;
    margin-top: 30px; padding: 20px; border-top: 1px solid #ad704b;
    background: #efe4d2;
  }
  .install-notice svg { width: 24px; height: 24px; color: #984b2a; }
  .install-notice h3 { margin: 0 0 8px; font-size: 15px; }
  .install-notice p { margin: 0; color: var(--muted); font-size: 14px; }
  ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  ol.steps li { position: relative; padding: 18px 0 18px 45px; border-top: 1px solid var(--line); font-size: 15px; }
  ol.steps li::before { counter-increment: step; content: counter(step, decimal-leading-zero); position: absolute; left: 0; color: var(--accent); font-weight: 700; font-size: 12px; }
  .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 35px; }
  .link-row { display: flex; flex-direction: column; gap: 4px; padding: 18px 0; border-top: 1px solid var(--line); text-decoration: none; }
  .link-row b { font-size: 16px; }
  .link-row b::after { content: " ↗"; }
  .link-row span { font-size: 13px; color: var(--muted); }
  footer { margin-top: 90px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  footer .logo { width: 24px; height: 24px; border-radius: 6px; }
  footer .copy { margin-left: auto; }
  footer .copy a { text-underline-offset: 4px; }
  @media (max-width: 760px) {
    .hero-intro, .install { grid-template-columns: 1fr; gap: 28px; }
    h1 { max-width: 12ch; }
    .features { grid-template-columns: 1fr; }
    .links { grid-template-columns: 1fr; gap: 0; }
    .stage { margin-top: 42px; }
    .install .sub { margin-top: 14px; }
  }
  @media (max-width: 480px) {
    .wrap { padding-left: 18px; padding-right: 18px; }
    .brand span { font-size: 11px; }
    .card { left: 15%; width: 70%; top: 6%; padding: 7px; border-radius: 8px; }
    .art { width: 35px; border-radius: 6px; }
    .meta .t { font-size: 11px; }
    .meta .a, .meta .b { font-size: 10px; }
    .controls { margin-top: 3px; }
    .controls .play { width: 18px; height: 18px; }
    .controls svg { width: 9px; height: 9px; }
    .feature { grid-template-columns: 1fr; gap: 8px; }
    footer { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .headunit { animation: arrive .8s cubic-bezier(.16, 1, .3, 1) both; }
    .card { animation: card-cycle 8.2s .35s linear infinite both; }
    .countdown { animation: countdown-visibility 8.2s .35s steps(1, end) infinite both; }
    .countdown-number { animation: countdown-pop 8.2s .35s linear infinite both; }
    .countdown-number::before { animation: countdown-digits 8.2s .35s steps(1, end) infinite both; }
    .countdown-progress { animation: countdown-ring 8.2s .35s linear infinite both; }
    .stage:is(.offscreen, .page-hidden) :is(.card, .countdown, .countdown-number, .countdown-progress),
    .stage:is(.offscreen, .page-hidden) .countdown-number::before { animation-play-state: paused; }
    @keyframes arrive { from { transform: translateY(18px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
    @keyframes card-cycle {
      0% { transform: translateY(-160%); animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
      8.5366%, 69.5122% { transform: translateY(0); }
      69.5122% { animation-timing-function: cubic-bezier(.4, 0, 1, 1); }
      75.6098%, 100% { transform: translateY(-160%); }
    }
    @keyframes countdown-visibility {
      0% { opacity: 0; }
      8.5366% { opacity: 1; }
      69.5122%, 100% { opacity: 0; }
    }
    @keyframes countdown-digits {
      0% { content: ""; }
      8.5366% { content: "5"; }
      20.7317% { content: "4"; }
      32.9268% { content: "3"; }
      45.122% { content: "2"; }
      57.3171% { content: "1"; }
      69.5122%, 100% { content: ""; }
    }
    @keyframes countdown-pop {
      8.5366%, 20.7317%, 32.9268%, 45.122%, 57.3171% { transform: scale(1.22); }
      11%, 23.2%, 35.4%, 47.6%, 59.8%, 100% { transform: scale(1); }
    }
    @keyframes countdown-ring {
      0%, 8.5366% { stroke-dashoffset: 0; }
      69.5122%, 100% { stroke-dashoffset: 107; }
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="logo" src="logo.svg" alt="Media Overlay">
    <div class="brand">Media Overlay<span data-i18n="brandSub"></span></div>

  <main>

      </div>

    <div class="stage">
      <div>

                <rect x="690" y="341" width="66" height="67" rx="3"/><rect x="774" y="344" width="81" height="72" rx="3"/>

      </a>
      <a class="link-row" href="https://github.com/dosoft/mediaoverlay/releases">
        <b data-i18n="githubReleases"></b><span data-i18n="githubReleasesSub"></span>
      </a>
    </div>
  </section>
  </main>

  <footer>
    <img class="logo" src="logo.svg" alt="">
    <span>Media Overlay</span>
    <span class="copy">&copy; <a href="https://olegd.com">Oleg Danilov</a></span>
  </footer>
</div>

<script>
const I18N = {
  ru: {
    brandSub: "всплывающая панель управления музыкой",
    h1: "Музыка поверх навигатора",
    lead: "Музыка меняется — поверх текущего приложения на несколько секунд выезжает компактная карточка: обложка, название, исполнитель, альбом и кнопки. Она не забирает фокус и не мешает нажимать на то, что под ней.",
    download: "Скачать APK",
    telegramGroup: "Telegram-группа",

    installTitle: "Установка",
    installSub: "Один раз устанавливаем самостоятельно, затем прилетают автоапдейты через OTA.",
    installNoticeTitle: "Предупреждение при установке",
    installNotice: "Android или Google Play Защита могут предупредить о возможной опасности при установке APK вне Google Play. Для работы приложение также запрашивает несколько разрешений. Причина предупреждения зависит от проверки устройства — внимательно прочитайте сообщение и скачивайте APK только с официальных страниц проекта.",
    s1: "Скачайте APK из последнего релиза.",

    s4: "Включите сервис и запустите музыку — карточка появится при смене композиции.",
    communityTitle: "Где следить",
    telegramGroupSub: "Вопросы, баги, тема «Релизы»",
    telegramChannelSub: "Только новые версии",
    githubReleases: "GitHub Releases",
    githubReleasesSub: "Все версии и файлы"
  },
  en: {
    brandSub: "now-playing card for head units",
    h1: "Your track, over the navigator",
    lead: "The song changes — and a compact card slides in over the current app for a few seconds: artwork, title, artist, album and controls. It never takes focus and never blocks taps on what is underneath.",
    download: "Download APK",
    telegramGroup: "Telegram group",
    telegramChannel: "Telegram channel",
    releaseFallback: "Latest release on GitHub",
    cardHint: "this is how the card looks in the car",
    featuresTitle: "What it does",
    f1t: "Six themes",
    f1d: "Linen, Porcelain, Obsidian, Night Drive, Aurora, Blueprint — from warm paper to neon.",
    f2t: "Tap to switch theme",
    f2d: "A tap on the card, outside the buttons, moves to the next skin and replays the same track.",
    f3t: "Settings",
    f3d: "Position, card width, timings and animation.",
    f5t: "Updates itself",
    f5d: "Once a day and on demand it checks for a new build and installs it after you confirm.",
    installTitle: "Install",
    installSub: "Install once by hand — after that updates arrive over the air (OTA).",
    installNoticeTitle: "Installation warning",
    installNotice: "Android or Google Play Protect may warn about a potential risk when installing an APK from outside Google Play. The app also needs several permissions to work. The reason for a warning depends on your device's checks — read the message carefully and download the APK only from the project's official pages.",
    s1: "Download the APK from the latest release.",
    s2: "Allow installs from this source and open the file.",
    s3: "Grant every permission the app asks for: overlay, notifications, media sessions, background work.",
    s4: "Turn the service on and start playing — the card appears on every track change.",
    communityTitle: "Where to follow",
    telegramGroupSub: "Questions, bugs, the “Releases” topic",
    telegramChannelSub: "New versions only",
    githubReleases: "GitHub Releases",
    githubReleasesSub: "Every version and file"
  }
};

const REPO = 'dosoft/mediaoverlay';
const RELEASE_API = 'https://api.github.com/repos/' + REPO + '/releases/latest';
let currentLang = 'ru';
let latestRelease = null;
const stage = document.querySelector('.stage');

function formatDate(iso) {
  if (!iso) return '';
  try {
    return new Intl.DateTimeFormat(currentLang === 'ru' ? 'ru-RU' : 'en-GB',
      { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(iso));
  } catch (e) { return String(iso).slice(0, 10); }
}

function renderRelease() {
  const text = document.getElementById('releaseText');
  const link = document.getElementById('release');
  const download = document.getElementById('download');
  if (!latestRelease) { text.textContent = I18N[currentLang].releaseFallback; return; }
  const date = formatDate(latestRelease.date);
  text.innerHTML = '<b>' + latestRelease.version + '</b>' + (date ? ' \u00b7 <span class="date">' + date + '</span>' : '');
  link.href = latestRelease.pageUrl;
  download.href = latestRelease.apkUrl;
}

function fromFeed(d) {
  if (!d || !d.versionName) return null;
  const v = d.versionName;
  return {
    version: v,
    date: d.publishedAt || null,
    pageUrl: 'https://github.com/' + REPO + '/releases/tag/v' + v,
    apkUrl: d.apkUrl || ('https://github.com/' + REPO + '/releases/download/v' + v + '/MediaOverlay-' + v + '.apk')
  };
}

function fromApi(rel) {
  const apk = (rel.assets || []).find(function (a) { return /\.apk$/i.test(a.name); });
  return {
    version: (rel.tag_name || '').replace(/^v/, '') || rel.name || '',
    date: rel.published_at || null,
    pageUrl: rel.html_url,
    apkUrl: apk ? apk.browser_download_url : rel.html_url
  };
}

async function loadRelease() {
  try {
    const r = await fetch('latest.json', { cache: 'no-store' });
    if (r.ok) {
      const rel = fromFeed(await r.json());
      if (rel) { latestRelease = rel; renderRelease(); return; }
    }
  } catch (e) { /* fall through */ }
  try {
    const r = await fetch(RELEASE_API, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (r.ok) {
      const rel = fromApi(await r.json());
      if (rel && rel.version) { latestRelease = rel; renderRelease(); }
    }
  } catch (e) { /* keep the fallback link */ }
}

function applyLang(lang) {
  currentLang = lang === 'en' ? 'en' : 'ru';
  const dict = I18N[currentLang];
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    const value = dict[el.dataset.i18n];
    if (value !== undefined) el.textContent = value;
  });
  document.querySelectorAll('[data-lang]').forEach(function (btn) {
    btn.setAttribute('aria-pressed', String(btn.dataset.lang === currentLang));
  });
  try { localStorage.setItem('mo-lang', currentLang); } catch (e) {}
  renderRelease();
}

const params = new URLSearchParams(location.search);
const saved = (function () { try { return localStorage.getItem('mo-lang'); } catch (e) { return null; } })();
applyLang(params.get('lang') === 'en' || (saved === 'en' && params.get('lang') !== 'ru') ? 'en' : 'ru');

document.querySelectorAll('[data-lang]').forEach(function (btn) {
  btn.addEventListener('click', function () { applyLang(btn.dataset.lang); });
});

if ('IntersectionObserver' in window) {
  new IntersectionObserver(function (entries) {
    stage.classList.toggle('offscreen', !entries[0].isIntersecting);
  }).observe(stage);
}
document.addEventListener('visibilitychange', function () {
  stage.classList.toggle('page-hidden', document.hidden);
});

loadRelease();
</script>
</body>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Overlay — оверлей трека для Android-магнитол</title>
<meta name="description" content="Компактная карточка с текущим треком поверх любого приложения для Android-магнитол и автомобильных Android-устройств.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0b1020;
    --bg-soft: #121a2e;
    --card: rgba(255, 255, 255, 0.04);
    --line: rgba(255, 255, 255, 0.10);
    --text: #f4f6fb;
    --muted: #9aa4bd;
    --accent: #8b7cf6;
    --accent-strong: #6750a4;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(139, 124, 246, 0.22), transparent 60%),
      radial-gradient(800px 500px at 0% 10%, rgba(45, 212, 191, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .logo { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 18px 40px rgba(103, 80, 164, 0.45); }
  .titles { flex: 1 1 260px; }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.02em; }
  .tagline { margin: 4px 0 0; color: var(--muted); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; padding: 8px 16px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--accent-strong); color: #fff; }
  .hero { margin: 28px 0 0; font-size: 18px; color: #dde3f3; }
  .hero strong { color: #fff; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 26px 0 0; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    padding: 14px 22px; border-radius: 999px; font-weight: 600; font-size: 15px;
    border: 1px solid var(--line); color: var(--text); background: var(--card);
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .btn:hover { transform: translateY(-1px); border-color: rgba(139, 124, 246, 0.55); }
  .btn.primary { background: var(--accent-strong); border-color: transparent; }
  .btn.primary:hover { background: #755cb8; }
  h2 { font-size: 20px; margin: 44px 0 14px; letter-spacing: -0.01em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }
  ol.steps { margin: 0; padding-left: 22px; color: #dde3f3; }
  ol.steps li { margin: 8px 0; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  footer { margin-top: 52px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer a { color: #c9c3ff; text-decoration: none; }
  code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 6px; font-size: .92em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo.svg" alt="Media Overlay">
    <div class="titles">
      <h1>Media Overlay</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Language / Язык">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <p class="hero" data-i18n="hero"></p>

  <div class="actions">
    <a class="btn primary" href="https://github.com/dosoft/mediaoverlay/releases/latest" data-i18n="download"></a>
    <a class="btn" href="https://t.me/media_overlay" data-i18n="telegramChannel"></a>
    <a class="btn" href="https://t.me/+eox86TLYGdRlZTJi" data-i18n="telegramGroup"></a>
  </div>

  <h2 data-i18n="featuresTitle"></h2>
  <div class="grid">
    <div class="card"><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></div>
    <div class="card"><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></div>
    <div class="card"><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></div>
    <div class="card"><h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p></div>
    <div class="card"><h3 data-i18n="f5t"></h3><p data-i18n="f5d"></p></div>
    <div class="card"><h3 data-i18n="f6t"></h3><p data-i18n="f6d"></p></div>
  </div>

  <h2 data-i18n="installTitle"></h2>
  <ol class="steps">
    <li data-i18n="s1"></li>
    <li data-i18n="s2"></li>
    <li data-i18n="s3"></li>
    <li data-i18n="s4"></li>
  </ol>

  <footer>
    <span data-i18n="footer"></span>
  </footer>
</div>

<script>
const I18N = {
  ru: {
    tagline: "Оверлей с текущим треком для Android-магнитол",
    hero: "Когда в любом музыкальном приложении, публикующем MediaSession (<strong>Spotify</strong>, <strong>YouTube Music</strong>, <strong>Яндекс Музыка</strong>, VLC, Poweramp, локальные плееры), меняется трек, поверх текущего приложения — например, навигатора — выезжает небольшая «стеклянная» карточка, остаётся несколько секунд и уезжает обратно. Она не перехватывает фокус и не блокирует касания по приложению под ней.",
    download: "Скачать APK",
    telegramChannel: "Telegram-канал",
    telegramGroup: "Группа и обсуждение",
    featuresTitle: "Что внутри",
    f1t: "Шесть оформлений",
    f1d: "Linen, Porcelain, Obsidian, Night Drive, Aurora и Blueprint — от тёплой бумаги до неона.",
    f2t: "Смена темы тапом",
    f2d: "Тап по плашке вне кнопок переключает оформление и заново показывает тот же трек.",
    f3t: "Настройка под себя",
    f3d: "Позиция на экране, ширина карточки, тайминги и анимация появления — кнопками − и +.",
    f4t: "Для машины",
    f4d: "Крупные сенсорные цели, высокий контраст, читаемость днём и ночью.",
    f5t: "Самообновление",
    f5d: "Раз в сутки и по кнопке приложение проверяет новую версию и ставит её после подтверждения.",
    f6t: "Без телеметрии",
    f6d: "В сеть приложение выходит только за обновлениями, и это можно выключить.",
    installTitle: "Установка",
    s1: "Скачайте <code>MediaOverlay-&lt;версия&gt;.apk</code> из последнего релиза.",
    s2: "Разрешите установку из этого источника и откройте файл.",
    s3: "Выдайте разрешения «Поверх других приложений» и доступ к уведомлениям.",
    s4: "Включите сервис и запустите музыку — карточка появится при смене трека.",
    footer: 'Лицензия MIT · исходный код в приватном репозитории · сборки на <a href="https://github.com/dosoft/mediaoverlay/releases">GitHub</a>'
  },
  en: {
    tagline: "Now-playing overlay for Android head units",
    hero: "Whenever the track changes in any music app that publishes a MediaSession (<strong>Spotify</strong>, <strong>YouTube Music</strong>, <strong>Yandex Music</strong>, VLC, Poweramp, local players), a small glass-like card slides in over the current app — the navigator, for example — stays for a few seconds and slides away. It never takes focus and never blocks touches on the app underneath.",
    download: "Download APK",
    telegramChannel: "Telegram channel",
    telegramGroup: "Group & discussion",
    featuresTitle: "What's inside",
    f1t: "Six skins",
    f1d: "Linen, Porcelain, Obsidian, Night Drive, Aurora and Blueprint — from warm paper to neon.",
    f2t: "Tap to switch theme",
    f2d: "A tap on the card, outside its buttons, moves to the next skin and replays the same track.",
    f3t: "Tuned for you",
    f3d: "Screen position, card width, timings and entrance animation — all with − and + buttons.",
    f4t: "Made for driving",
    f4d: "Large touch targets, high contrast, readable by day and by night.",
    f5t: "Self-updating",
    f5d: "Once a day and on demand the app checks for a new build and installs it after you confirm.",
    f6t: "No telemetry",
    f6d: "The only network use is the update check, and it can be switched off.",
    installTitle: "Install",
    s1: "Download <code>MediaOverlay-&lt;version&gt;.apk</code> from the latest release.",
    s2: "Allow installs from this source and open the file.",
    s3: "Grant “Display over other apps” and notification access.",
    s4: "Turn the service on and start playing — the card appears on every track change.",
    footer: 'MIT licensed · sources in a private repository · builds on <a href="https://github.com/dosoft/mediaoverlay/releases">GitHub</a>'
  }
};

function applyLang(lang) {
  const dict = I18N[lang] || I18N.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const value = dict[el.dataset.i18n];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('[data-lang]').forEach(btn => {
    btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang));
  });
  try { localStorage.setItem('mo-lang', lang); } catch (e) {}
}

const params = new URLSearchParams(location.search);
const saved = (() => { try { return localStorage.getItem('mo-lang'); } catch (e) { return null; } })();
const initial = params.get('lang') || saved || 'ru';
applyLang(initial === 'en' ? 'en' : 'ru');

document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});
</script>
</body>
</html>
